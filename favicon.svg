<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="tinyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="tinyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Base Rounded Container -->
  <rect width="128" height="128" rx="28" fill="url(#tinyBg)" />
  <!-- Inner subtle border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <!-- Stylized "T" & Tool Cube Glyph with Shadow -->
  <g filter="url(#shadow)">
    <!-- Top Bar of T -->
    <rect x="28" y="30" width="72" height="18" rx="9" fill="url(#tinyGlow)" />
    <!-- Vertical Stem of T / Tool Body -->
    <rect x="53" y="44" width="22" height="52" rx="10" fill="url(#tinyGlow)" />
    <!-- Dynamic Accent Gem / Spark (representing micro-light / speed) -->
    <circle cx="88" cy="74" r="8" fill="#38bdf8" />
    <polygon points="88,60 92,70 102,74 92,78 88,88 84,78 74,74 84,70" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
